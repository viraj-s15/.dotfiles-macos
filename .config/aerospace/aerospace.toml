# AeroSpace single-display setup
config-version = 2

start-at-login = true
auto-reload-config = true

# Keep SketchyBar's workspace indicator synchronized with AeroSpace.
exec-on-workspace-change = ['/bin/bash', '-c',
  'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]

# Keep exactly seven named workspaces available.
persistent-workspaces = ['1', '2', '3', '4', '5', '6', '7']

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
accordion-padding = 30
automatically-unhide-macos-hidden-apps = true

# Focus follows mouse: hover over a window to focus it
focus-follows-mouse.enabled = true

# The display's 32pt safe area contains the notch and native menu bar.
gaps.inner.horizontal = 4
gaps.inner.vertical = 4
gaps.outer.left = 2
gaps.outer.bottom = 2
# macOS already reserves the notched menu-bar safe area; add only a small gap
# between SketchyBar and tiled windows.
gaps.outer.top = 5
gaps.outer.right = 2

# Raycast should remain an overlay instead of becoming a tiled window.
[[on-window-detected]]
if.app-id = 'com.raycast.macos'
run = 'layout floating'

# Keep Finder windows floating (a web modal's "choose file" spawns a real Finder
# window, which must not steal a tile).
[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'layout floating'

# Sandboxed apps (Safari, Mail) host the open/save panel in this XPC process.
[[on-window-detected]]
if.app-id = 'com.apple.appkit.xpc.openAndSavePanelService'
run = 'layout floating'

# Zen/Firefox draws its file picker as an in-process window with a BLANK title.
# Without this it matches only the catch-all rule below and gets tiled, splitting
# the workspace for as long as the picker is open.
[[on-window-detected]]
if.app-id = 'app.zen-browser.zen'
if.window-title-regex-substring = '^$'
run = 'layout floating'

# Mail creates a short-lived "Untitled" helper window while searching. Keep only
# that helper floating so it cannot split or reset the main Mail window's layout.
[[on-window-detected]]
if.app-id = 'com.apple.mail'
if.window-title-regex-substring = '^Untitled$'
run = 'layout floating'

# Every other detected window is tiled, and its workspace cannot remain stacked.
[[on-window-detected]]
if = 'true'
run = ['layout tiling', 'layout --root tiles']

[mode.main.binding]
# Cycle only through workspaces 1-7 and wrap at the ends.
cmd-left  = 'echo -- 1 2 3 4 5 6 7 | workspace --stdin --wrap-around prev'
cmd-right = 'echo -- 1 2 3 4 5 6 7 | workspace --stdin --wrap-around next'

# Jump directly to workspaces 1-7.
cmd-1 = 'workspace 1'
cmd-2 = 'workspace 2'
cmd-3 = 'workspace 3'
cmd-4 = 'workspace 4'
cmd-5 = 'workspace 5'
cmd-6 = 'workspace 6'
cmd-7 = 'workspace 7'

# Move the focused window directly to workspaces 1-7 and follow it.
# Option is used here so macOS Command+Shift+3/4/5 screenshots still work.
alt-shift-1 = 'move-node-to-workspace --focus-follows-window 1'
alt-shift-2 = 'move-node-to-workspace --focus-follows-window 2'
alt-shift-3 = 'move-node-to-workspace --focus-follows-window 3'
alt-shift-4 = 'move-node-to-workspace --focus-follows-window 4'
alt-shift-5 = 'move-node-to-workspace --focus-follows-window 5'
alt-shift-6 = 'move-node-to-workspace --focus-follows-window 6'
alt-shift-7 = 'move-node-to-workspace --focus-follows-window 7'

# Move the focused window to an adjacent workspace and follow it.
cmd-shift-left  = 'echo -- 1 2 3 4 5 6 7 | move-node-to-workspace --stdin --wrap-around --focus-follows-window prev'
cmd-shift-right = 'echo -- 1 2 3 4 5 6 7 | move-node-to-workspace --stdin --wrap-around --focus-follows-window next'

# Window focus and movement within a workspace.
alt-left = 'focus left'
alt-down = 'focus down'
alt-up = 'focus up'
alt-right = 'focus right'
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Layout controls.
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'
alt-shift-space = 'layout floating tiling'
alt-f = 'fullscreen'
alt-shift-r = 'flatten-workspace-tree'

# Resize mode: Alt-R, then H/J/K/L; Enter or Esc exits.
alt-r = 'mode resize'

[mode.resize.binding]
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'
enter = 'mode main'
esc = 'mode main'
