# AeroSpace single-display setup
config-version = 2

start-at-login = true
auto-reload-config = true

# Keep exactly five named workspaces available.
persistent-workspaces = ['1', '2', '3', '4', '5']

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
accordion-padding = 30
automatically-unhide-macos-hidden-apps = true

# The display's 32pt safe area contains the notch and native menu bar.
gaps.inner.horizontal = 8
gaps.inner.vertical = 8
gaps.outer.left = 4
gaps.outer.bottom = 4
gaps.outer.top = 8
gaps.outer.right = 4

# Raycast should remain an overlay instead of becoming a tiled window.
[[on-window-detected]]
if.app-id = 'com.raycast.macos'
run = 'layout floating'

# Every other detected window is tiled, and its workspace cannot remain stacked.
[[on-window-detected]]
if = 'true'
run = ['layout tiling', 'layout --root tiles']

[mode.main.binding]
# Cycle only through workspaces 1-5 and wrap at the ends.
cmd-left  = 'echo -- 1 2 3 4 5 | workspace --stdin --wrap-around prev'
cmd-right = 'echo -- 1 2 3 4 5 | workspace --stdin --wrap-around next'

# Jump directly to workspaces 1-5.
cmd-1 = 'workspace 1'
cmd-2 = 'workspace 2'
cmd-3 = 'workspace 3'
cmd-4 = 'workspace 4'
cmd-5 = 'workspace 5'

# Move the focused window directly to workspaces 1-5 and follow it.
# Option is used here so macOS Command+Shift+3/4/5 screenshots still work.
alt-shift-1 = 'move-node-to-workspace --focus-follows-window 1'
alt-shift-2 = 'move-node-to-workspace --focus-follows-window 2'
alt-shift-3 = 'move-node-to-workspace --focus-follows-window 3'
alt-shift-4 = 'move-node-to-workspace --focus-follows-window 4'
alt-shift-5 = 'move-node-to-workspace --focus-follows-window 5'

# Move the focused window to an adjacent workspace and follow it.
cmd-shift-left  = 'echo -- 1 2 3 4 5 | move-node-to-workspace --stdin --wrap-around --focus-follows-window prev'
cmd-shift-right = 'echo -- 1 2 3 4 5 | move-node-to-workspace --stdin --wrap-around --focus-follows-window next'

# Window focus and movement within a workspace.
alt-left = 'focus left'
alt-down = 'focus down'
alt-up = 'focus up'
alt-right = 'focus right'
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Layout controls.
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'
alt-shift-space = 'layout floating tiling'
alt-f = 'fullscreen'
alt-shift-r = 'flatten-workspace-tree'

# Resize mode: Alt-R, then H/J/K/L; Enter or Esc exits.
alt-r = 'mode resize'

[mode.resize.binding]
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'
enter = 'mode main'
esc = 'mode main'
